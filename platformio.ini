[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = minspiff.csv

[env:xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
board_build.mcu = esp32c6
board_build.partitions = minspiff.csv

[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = abigapp.csv
